services:
  rag-db:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: pwnai_rag
      POSTGRES_USER: pwnai
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:-pwnai_dev}
    ports:
      - "127.0.0.1:${RAG_POSTGRES_PORT:-55432}:5432"
    volumes:
      - rag-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pwnai -d pwnai_rag"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  rag-postgres-data:
