<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PWN-AI</title>
    <meta name="description" content="PWN-AI offensive security workspace with streamed chat and pentest runtime." />
    <script>
      (() => {
        const stored = localStorage.getItem("pwn-ai-theme");
        const theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="page-glow page-glow--left"></div>
      <div class="page-glow page-glow--right"></div>

      <header class="site-topbar">
        <a class="brand-lockup" href="/">
          <img class="brand-lockup__wordmark brand-lockup__wordmark--compact" src="/assets/pwn-ai-wordmark.png" alt="PWN-AI" />
        </a>

        <div class="site-topbar__actions">
          <nav class="site-nav">
            <a class="nav-link nav-link--active" data-nav href="/">Home</a>
            <a class="nav-link" data-nav data-auth-nav href="/auth">Sign in</a>
            <a class="nav-link" data-nav href="/chat">Chat</a>
            <a class="nav-link" data-nav href="/session">Session</a>
          </nav>

          <div class="topbar-actions">
            <span id="public-user-chip" class="user-chip" hidden>Authenticated</span>
            <a id="workspace-link" class="ghost-button" href="/chat" hidden>Workspace</a>
            <button id="public-signout-button" class="ghost-button" type="button" hidden>Sign out</button>
            <button id="theme-toggle" class="icon-button" type="button" aria-label="Toggle theme"></button>
          </div>
        </div>
      </header>

      <main class="home-stage">
        <div class="home-mark">
          <img class="home-logo" src="/assets/pwn-ai-icon.png" alt="PWN-AI logo" />
        </div>

        <div class="home-copy">
          <h1>Offensive security,<br>streamed live.</h1>
          <p class="body-copy body-copy--centered">A local workspace for AI-powered pentesting with real-time output.</p>
          <p id="home-user-line" class="helper-text" hidden></p>
        </div>

        <div class="action-row action-row--centered">
          <a id="home-primary-link" class="primary-button" href="/auth">Get started</a>
          <a id="home-secondary-link" class="ghost-button" href="/chat">Open chat</a>
        </div>
      </main>
    </div>
    <script type="module" src="/home.js"></script>
  </body>
</html>
