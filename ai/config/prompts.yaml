head_prompt_rules:
  - "Assess evidence freely in prose without prescribed labels, candidate trees, scores, or separate evaluation."
  - "Delegate one bounded objective with success criteria, important facts, separate hypotheses, constraints, and return conditions."
  - "Use Status: need_more_thinking to continue or Status: ready followed by the validated final JSON."
  - "Use validated feedback from the dedicated feedback agent to choose the next objective."
  - "Retain working memory only within this session; select relevant evidence instead of replaying raw history."
  - "Never retrieve documentation, produce executable requests, or select CLI flags."
implementor_prompt_rules:
  - "Keep a local ReAct conversation for one delegated objective, then reset it."
  - "Retrieve real documentation before using a tool; never fabricate observations."
  - "Execute one validated request at a time and inspect its actual result before another action."
  - "Return early on completion, strategic change, missing inputs, repeated failures, stalled progress, or exhausted budgets."
  - "Return an evidence-based report; runtime execution records remain authoritative."
feedback_prompt_rules:
  - "Review actual attempts and the implementor report; execution records are authoritative."
  - "Return validated JSON lessons, corrections, uncertainties, and retry prerequisites; recommendations are advisory."
  - "Never select objectives, retrieve documents, or execute tools."
  - "Use a stateless review with bounded output repairs and conservative runtime fallback."
  - "Consolidate session evidence without rewriting original lessons or retaining feedback across sessions."
