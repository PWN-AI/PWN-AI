ollama:
  # Fallback provider if a model role omits `provider`.
  mode: "cloud"

  providers:
    # Local Ollama server
    local:
      base_url: "http://localhost:11434"

    # Ollama cloud API
    cloud:
      base_url: "https://ollama.com"
      # Prefer env var over hardcoding key in this file
      api_key_env: "OLLAMA_API_KEY"
      auth_header: "Authorization"
      auth_scheme: "Bearer"
      # api_key: ""  # Optional, discouraged: don't commit secrets

models:
  head:
    # Choose per-role provider: local | cloud
    provider: "cloud"
    model: "gemma4:31b-cloud" 
    temperature: 0.2 #original 0.2
    # change the reasoning to true/false for wanted models (especially qwen and deepseek)
    reasoning: false 
    num_ctx: 32768 #32768
  implementor:
    provider: "cloud"
    model: "gemma4:31b-cloud"
    temperature: 0.1
    reasoning: false
    num_ctx: 32768 #32768
  embedding:
    provider: "local"
    model: "nomic-embed-text:latest"

# make the embedding local to save API cost when presenting
# model: nomic-embed-text:latest
# provider: local

runtime:
  max_tasks: 1
  max_replans: 8
  max_new_tasks_per_replan: 1
  ask_permission_per_action: true
  auto_approve: false

rag:
  enabled: true
  persist_dir: "ai/rag/index"
  # Head candidate search/reflection has no retrieval loop.
  # Maximum ReAct iterations for implementor
  max_react_iterations_impl: 3

