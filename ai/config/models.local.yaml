ollama:
  # Fallback provider if a model role omits `provider`.
  mode: "cloud"

  providers:
    # Local Ollama server
    local:
      base_url: "http://localhost:11434"

    # Ollama cloud API
    cloud:
      base_url: "https://ollama.com"
      # Prefer env var over hardcoding key in this file
      api_key_env: "OLLAMA_API_KEY"
      auth_header: "Authorization"
      auth_scheme: "Bearer"
      # api_key: ""  # Optional, discouraged: don't commit secrets

models:
  head:
    # Choose per-role provider: local | cloud
    provider: "cloud"
    model: "gpt-oss:120b"
    temperature: 0.2 #original 0.2
    # GPT-OSS uses low/medium/high; other models may use true/false.
    reasoning: "low"
    num_ctx: 32768 #32768
  implementor:
    provider: "cloud"
    model: "gpt-oss:120b"
    temperature: 0.1
    reasoning: "low"
    num_ctx: 32768 #32768
runtime:
  max_tasks: 1
  max_replans: 8
  max_new_tasks_per_replan: 1
  ask_permission_per_action: true
  auto_approve: false

rag:
  enabled: true
  database_url_env: "RAG_DATABASE_URL"
  snapshot_path: "ai/rag/database/knowledge.json"
  embedding:
    provider: "cohere"
    model: "embed-v4.0"
    dimensions: 1024
    api_key_env: "COHERE_API_KEY"
  # Maximum ReAct iterations for head planner (plan/replan)
  max_react_iterations_head: 4
  # Maximum ReAct iterations for implementor
  max_react_iterations_impl: 3

