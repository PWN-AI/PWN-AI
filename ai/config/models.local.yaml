ollama:
  # Fallback provider if a model role omits `provider`.
  mode: "cloud"

  providers:
    # Local Ollama server
    local:
      base_url: "http://localhost:11434"

    # Ollama cloud API
    cloud:
      base_url: "https://ollama.com"
      # Prefer env var over hardcoding key in this file
      api_key_env: "OLLAMA_API_KEY"
      auth_header: "Authorization"
      auth_scheme: "Bearer"
      # api_key: ""  # Optional, discouraged: don't commit secrets

models:
  head:
    # Choose per-role provider: local | cloud
    provider: "local"
    model: "qwen3.5:4b"
    temperature: 0.2 #original 0.2
    # change the reasoning to true/false for wanted models (especially qwen and deepseek)
    reasoning: false 
    num_ctx: 16384 #32768
  implementor:
    provider: "local"
    model: "qwen3.5:4b"
    temperature: 0.1
    reasoning: false
    num_ctx: 16384 #32768
  feedback:
    # Independent role; start with the same underlying model as the head.
    provider: "local"
    model: "qwen3.5:4b"
    temperature: 0.1
    reasoning: false
    num_ctx: 16384 #32768
  embedding:
    provider: "local"
    model: "nomic-embed-text:latest"

# make the embedding local to save API cost when presenting
# model: nomic-embed-text:latest
# provider: local

runtime:
  max_tasks: 12
  max_replans: 8
  # The head delegates one objective; the implementor may take several real actions.
  max_actions_per_objective: 3
  max_consecutive_failures: 2
  objective_timeout_seconds: 600
  head_thinking_rounds: 3
  feedback_validation_retries: 1
  ask_permission_per_action: true
  auto_approve: false

rag:
  enabled: true
  persist_dir: "ai/rag/index"
  # Head objective planning/reflection has no retrieval loop.
  # Maximum RAG calls per decision; a final execution/return call is reserved separately.
  max_react_iterations_impl: 3
  max_validation_retries_impl: 2

