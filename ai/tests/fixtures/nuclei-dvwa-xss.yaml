id: pwnai-local-dvwa-reflected-xss-test

info:
  name: Local DVWA reflected XSS integration test
  author: pwnai
  severity: medium
  description: Test fixture for an explicitly started local DVWA instance.
  tags: xss

http:
  - method: GET
    path:
      - "{{BaseURL}}?name=%3Cscript%3Ealert%28101%29%3C%2Fscript%3E"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "<script>alert(101)</script>"
